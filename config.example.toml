# Jira Bug Monitor settings. Copy this file to config.toml and fill it in.
# config.toml stays on your computer. Don't commit it or share it.

[jira]
base_url = "https://timeclockplus.atlassian.net"
email = "anaeem@tcpsoftware.com"
# Create a token at https://id.atlassian.com/manage-profile/security/api-tokens
# Paste it here, or leave it blank and set the JIRA_API_TOKEN environment variable.
api_token = ""

# Which tickets to watch. Default: every bug your account can see.
# Examples:  issuetype = Bug AND project in (HUM, TCP)
#            issuetype in (Bug, Defect)
jql = 'issuetype = Bug AND project in (HUMFE, HUM) AND created >= -60d'

poll_minutes = 5          # how often to check Jira
backfill_days = 90        # first run also loads bugs resolved in this window (used for estimates)
fetch_changelog = true    # full status history; needed for accurate fix estimates
retention_days = 60       # remove tickets from the dashboard once they're older than this

# My Tickets: everything assigned to you (any type), shown by status with time in each status.
my_jql = 'assignee = currentUser() AND project in (HUMFE, HUM) AND updated >= -60d'

[alerts]
new_bug = true
priority_raised = true
reopened = true
alert_on_first_sync = false   # don't flood you with every existing bug on day one
assigned_to_me = true         # a ticket gets assigned to you (always sent to Teams)
my_status_changes = true      # one of your tickets changes status, e.g. In Progress -> In QA (always sent)

# Slack, Teams, and email fire only at or above this priority.
# Desktop and dashboard alerts fire for everything.
external_min_priority = "Normal"   # Normal and above go to Teams; Minor/Trivial stay on the dashboard

desktop = true

# Slack: create an Incoming Webhook (api.slack.com/messaging/webhooks) and paste the URL.
slack_webhook = ""
# Teams (private, only you see it): in Teams open Apps > Workflows, pick the template
# "Post to a chat when a webhook request is received", choose "Chat with Flow bot",
# set yourself as the recipient, then paste the webhook URL it gives you here.
# Messages arrive as a 1:1 chat from Workflows. No channel, nobody else sees them.
teams_webhook = ""

email_enabled = false
smtp_host = "smtp.office365.com"
smtp_port = 587
smtp_starttls = true
smtp_user = ""
smtp_password = ""            # or set BUGMON_SMTP_PASSWORD
email_from = ""
email_to = ["anaeem@tcpsoftware.com"]   # only you

# GitHub: your PRs and branches, with live status, linked to Jira by ticket key.
# Token: github.com/settings/tokens/new, classic, "repo" scope. If tcp-software uses
# single sign-on, open the token afterward, choose Configure SSO, and Authorize it.
# Leave token blank to reuse the GitHub CLI login (`gh auth login`).
[github]
enabled = false
token = ""                    # or set GITHUB_TOKEN
username = ""                 # blank = detected from the token
orgs = ["tcp-software"]       # only PRs in these orgs
repos = []                    # extra repos to scan for your branches, e.g. ["tcp-software/web-schedule"]
jira_prefixes = ["HUMFE", "HUM"]
days = 60
alerts_to_external = true     # review requests, failing checks, approvals, and merges go to Teams

[dashboard]
host = "127.0.0.1"            # local only
port = 8765

[storage]
db_path = "data/monitor.db"   # relative to this folder

[priority]
# Most urgent first. Covers both Jira schemes; names not listed fall back to this built-in order.
order = ["Blocker", "Highest", "Critical", "High", "Major", "Medium", "Normal", "Low", "Minor", "Lowest", "Trivial"]
# What counts as "high priority" on the dashboard.
high = ["Blocker", "Highest", "Critical", "High", "Major"]
["Highest", "High", "Medium", "Low", "Lowest"]
