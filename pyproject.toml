[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-bug-monitor"
dynamic = ["version"]
description = "Jira and GitHub monitor with a live dashboard, Teams alerts, and Claude tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "mcp>=1.12,<2",
    "keyring>=24",
    "tomlkit>=0.12",
    "defusedxml>=0.7",
    "plyer>=2.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
bugmonitor = "bugmonitor.__main__:_main_with_help"

[tool.setuptools]
packages = ["bugmonitor"]

[tool.setuptools.package-data]
bugmonitor = ["static/*.html", "config.example.toml"]

[tool.setuptools.dynamic]
version = {attr = "bugmonitor.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
